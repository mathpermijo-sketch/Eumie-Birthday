<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Final Stage</title>

  <link rel="stylesheet" href="secret.css" />


   <!-- Google Fonts: Dancing Script + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
</head>

<body class="transition-playing">

  <!-- STAGE 4 ENTRANCE TRANSITION -->

  <div id="wallTransition">
    <div id="crackContainer"></div>
    <div id="breakFlash"></div>

    <div id="transitionMessage">
      Something is breaking...
    </div>
  </div>

  <!-- POV BLINK -->

  <div id="povBlink">
    <div class="eyelid eyelid-top"></div>
    <div class="eyelid eyelid-bottom"></div>
  </div>

  <!-- ORIGINAL STAGE 4 -->

  <div id="heartCursor">💚</div>
  <div id="flowerContainer"></div>

  <!-- PAGE BACKGROUND: change this image path whenever you want. -->
  <section class="secret-page" style="--page-background: url('images/eum.png')">

    <!-- PHOTO FILES: replace these names with pictures stored in the images folder. -->
    <div class="photo-paper-board">
      <figure class="photo-paper photo-paper-1" style="--photo: url('images/secret-photo-1.jpg')"><div class="photo-window"></div><figcaption>Photo 1</figcaption></figure>
      <figure class="photo-paper photo-paper-2" style="--photo: url('images/secret-photo-2.jpg')"><div class="photo-window"></div><figcaption>Photo 2</figcaption></figure>
      <figure class="photo-paper photo-paper-3" style="--photo: url('images/secret-photo-3.jpg')"><div class="photo-window"></div><figcaption>Photo 3</figcaption></figure>
      <figure class="photo-paper photo-paper-4" style="--photo: url('images/secret-photo-4.jpg')"><div class="photo-window"></div><figcaption>Photo 4</figcaption></figure>
      <figure class="photo-paper photo-paper-5" style="--photo: url('images/secret-photo-5.jpg')"><div class="photo-window"></div><figcaption>Photo 5</figcaption></figure>
    </div>

    <div class="content">
      <h1>Before this journey ends...</h1>

      <p>
        There are still a few things I want to tell you.
      </p>

      <div class="btn-area">

        <button class="secret-btn" id="letterBtn">
          💌 My Letter
        </button>

        <button class="secret-btn" id="wishesBtn">
          🌸 My Wishes
        </button>

        <!-- NEW VIDEO BUTTON -->

        <button
          class="secret-btn locked"
          id="videoBtn"
          disabled
        >
          🔒 Video
        </button>
      

        <!-- FINAL BUTTON -->

        <button
          class="secret-btn locked"
          id="lastBtn"
          disabled
        >
          🔒 One Last Thing
        </button>

       

      </div>
    </div>
  </section>

  <!-- MODAL -->

  <div class="modal" id="modal">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- FINAL SCREEN -->

  <div class="final-screen" id="finalScreen">
    <h1>Go outside your house.</h1>
  </div>

  <script src="secret.js"></script>

</body>

</html>
