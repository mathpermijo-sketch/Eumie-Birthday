<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stage 3</title>

  <link rel="stylesheet" href="web.css" />
</head>

<body>

  <section id="stage3">

    <div id="heartCursor">💚</div>



    <div class="page-content">

      <div class="top-buttons">


        <button class="stage-btn current-step" id="letterBtn">
          Letter I
        </button>

        <button class="stage-btn locked" id="letter2Btn" type="button">
          Letter II &#128274;
        </button>

        <button class="stage-btn locked" id="letter3Btn" type="button">
          Letter III &#128274;
        </button>

        <button class="stage-btn locked" id="letter4Btn" type="button">
          Letter IV &#128274;
        </button>

        <button class="stage-btn locked" id="wishBtn">
          Wish 🔒
        </button>

        <button class="stage-btn locked" id="questionBtn">
          Question 🔒
        </button>

        <button class="stage-btn locked" id="lastQuestionBtn">
          Last Question 🔒
        </button>

        <div class="final-box">
          <button class="final-btn" id="lockedFinalBtn" type="button" disabled aria-label="Secret button locked">
            Secret 🔒
          </button>
          <button id="finalBtn">Continue</button>
          <div class="progress" id="progressText">0/7</div>
        </div>

      </div>

      <div class="center-area">

        <h1 class="birthday-title">
          𝓗𝒶𝓅𝓅𝓎 𝐵𝒾𝓇𝓉𝒽𝒹𝒶𝓎 🌸
        </h1>

      </div>

    </div>

  </section>


  <!-- POPUP -->

  <div class="popup-area" id="popupArea">

    <div class="blur-bg"></div>

    <div class="mail-box" id="mailBox">

      <div class="mail" id="mail">

        <div class="mail-body"></div>

        <div class="mail-flap"></div>

        <div class="mail-heart">💚</div>

      </div>

      <p class="mail-text">
        Click the mail
      </p>

    </div>

    <div class="paper" id="paperBox"></div>

  </div>


  <!-- BLACK FADE ONLY -->

  <div id="blackFade"></div>


  <script src="web.js"></script>

</body>

</html>
