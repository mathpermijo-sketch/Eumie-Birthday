<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Stage 3</title>

  <link rel="stylesheet" href="web.css" />
</head>

<body>

  <section id="stage3">

    <div id="heartCursor">💚</div>

    <div class="page-content">

      <div class="top-buttons">

        <button class="stage-btn" id="letterBtn">
          Letter
        </button>

        <button class="stage-btn locked" id="wishBtn">
          Wish 🔒
        </button>

        <button class="stage-btn locked" id="questionBtn">
          Question 🔒
        </button>

        <button class="stage-btn locked" id="lastQuestionBtn">
          Last Question 🔒
        </button>

      </div>

      <div class="center-area">

        <h1 class="birthday-title">
          Happy Birthday
        </h1>

        <div class="final-box">

          <button class="final-btn" id="lockedFinalBtn">
            Locked 🔒
          </button>

          <button id="finalBtn">
            Continue
          </button>

          <div class="progress" id="progressText">
            0/4
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- POPUP -->

  <div class="popup-area" id="popupArea">

    <div class="blur-bg"></div>

    <div class="mail-box" id="mailBox">

      <div class="mail" id="mail">

        <div class="mail-body"></div>

        <div class="mail-flap"></div>

        <div class="mail-heart">💚</div>

      </div>

      <p class="mail-text">
        Click the mail
      </p>

    </div>

    <div class="paper" id="paperBox"></div>

  </div>


  <!-- BLACK FADE ONLY -->

  <div id="blackFade"></div>


  <script src="web.js"></script>

</body>

</html>
